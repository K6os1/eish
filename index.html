
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audi 26</title>

<style>
/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

/* BODY */
body {
    background-color: #f5f5f5;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 40px;
    background-color: #ffffff;
    border-bottom: 1px solid #ddd;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.nav-links button {
    margin: 0 5px;
    padding: 10px 15px;
    border: none;
    background-color: #005bac;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

.nav-links button:hover {
    background-color: #003f7f;
}

/* HERO */
.hero {
    margin: 30px auto;
    width: 90%;
    height: 300px;
    background-color: #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.hero-text {
    font-size: 24px;
    color: #333;
}

.hero-buttons {
    position: absolute;
    bottom: 20px;
}

.hero-buttons button {
    margin: 5px;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    border-radius: 5px;
}

.primary-btn {
    background-color: #333;
    color: white;
}

.secondary-btn {
    background-color: #fff;
    border: 1px solid #333;
}

/* CARDS */
.card-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 30px;
}

.card {
    background-color: white;
    padding: 20px;
    width: 250px;
    text-align: center;
    border: 1px solid #ddd;
}

.card-img {
    height: 100px;
    background-color: #ccc;
    margin-bottom: 15px;
}

.card button {
    margin-top: 10px;
    padding: 8px 15px;
    border: none;
    background-color: #005bac;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

/* SECTION TITLES */
.section-title {
    text-align: center;
    margin-top: 40px;
    font-weight: bold;
    color: #333;
}

/* FEATURED SECTION */
.featured {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 30px;
}

.feature-box {
    width: 250px;
    background-color: white;
    border: 1px solid #ddd;
    padding: 15px;
    text-align: center;
}

.feature-img {
    height: 120px;
    background-color: #ccc;
    margin-bottom: 10px;
}

/* FOOTER */
.footer {
    text-align: center;
    padding: 20px;
    background-color: #111;
    color: white;
}

/* SEARCH BOX */
.search-box input {
    padding: 5px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">AUDI</div>

    <div class="nav-links">
        <button onclick="navigate('models')">Models</button>
        <button>Book and Enquire</button>
        <button>Find a Dealer</button>
        <button>Login</button>
    </div>

    <div class="search-box">
        <input type="text" placeholder="Search">
    </div>
</div>

<!-- HERO SECTION -->
<div class="hero">
    <!-- INSERT MAIN IMAGE HERE -->
    <div class="hero-text">Main Image</div>

    <div class="hero-buttons">
        <button class="primary-btn">Explore Models</button>
        <button class="secondary-btn">Learn More</button>
    </div>
</div>

<!-- TOP CARDS -->
<div class="card-container">
    
    <div class="card">
        <div class="card-img"><!-- INSERT IMAGE HERE --></div>
        <h3>Contact</h3>
        <button>View Model</button>
    </div>

    <div class="card">
        <div class="card-img"><!-- INSERT IMAGE HERE --></div>
        <h3>About</h3>
        <button>Discover More</button>
    </div>

    <div class="card">
        <div class="card-img"><!-- INSERT IMAGE HERE --></div>
        <h3>Build and Price</h3>
        <button>See Offers</button>
    </div>

</div>

<!-- SECTION TITLES -->
<div class="section-title">Featured Model | Explore Electric | Special Offers</div>

<!-- FEATURED SECTION -->
<div class="featured">

    <div class="feature-box">
        <div class="feature-img"><!-- INSERT IMAGE HERE --></div>
        <h4>Featured Model</h4>
        <button>View Model</button>
    </div>

    <div class="feature-box">
        <div class="feature-img"><!-- INSERT IMAGE HERE --></div>
        <h4>Explore Electric</h4>
        <button>Discover More</button>
    </div>

    <div class="feature-box">
        <div class="feature-img"><!-- INSERT IMAGE HERE --></div>
        <h4>Special Offers</h4>
        <button>See Offers</button>
    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    © 2026 Audi Website Prototype
</div>

<!-- JAVASCRIPT -->
<script>
// Simple navigation simulation
function navigate(section) {
    alert("Navigating to " + section + " section...");
}

// Example interactive button
document.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
        console.log(btn.innerText + " clicked");
    });
});
</script>

</body>
</html>
